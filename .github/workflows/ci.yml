name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # The 1 job that decides what the change needs: tools/ci/scope.py prints each path's answer and
  # fast or full. A run with no base or a base it cannot read is full. A run by hand
  # (workflow_dispatch: `gh workflow run ci.yml --ref <branch>`) gates a candidate with no pull
  # request; it is given no base, so it is always full (ee-agent-kit/CI.md, "Where the health gate runs").
  # It also answers desktop=yes or no: yes for a change to install or platform code (scope.py's
  # DESKTOP_FILES and DESKTOP_FOLDERS), for a run with no base, and for every push to main (--desktop).
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide the scope of the change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="" desktop=""
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push) git fetch --no-tags --depth=1 origin "$BEFORE" || true; base="$BEFORE"; desktop=yes ;;
            workflow_dispatch) base="" ;;
          esac
          python3 tools/ci/scope.py --base "$base" --head HEAD ${desktop:+--desktop} --github-output

  # Every change: no toolchain; shellcheck, the site's build, the tests that start no engine, and the
  # kit's checks (make verify-site). It runs beside `full` too: its runner has no KiCad, so a test that
  # needs KiCad's files and does not say so fails on the pull request that adds it (PROCESSES.md P12).
  fast:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the Python packages the tests read (no engine)
        run: python -m pip install --progress-bar off -r requirements.txt
      - name: Verify the site, the documents and the kit
        id: gate
        run: make verify-site
      # A red gate keeps its evidence: its logs go into an artifact, bounded (tools/ci/kept_logs.py: 50 MB,
      # each file's last 2 MB) and kept 7 days. Never on success; the job holds no secret.
      - name: Keep the logs of the failed gate
        if: failure() && steps.gate.outcome == 'failure'
        run: python3 tools/ci/kept_logs.py "$RUNNER_TEMP/kept-logs" "${TMPDIR:-/tmp}/pytest-of-*"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.gate.outcome == 'failure'
        with:
          name: gate-logs-fast-gate
          path: ${{ runner.temp }}/kept-logs
          retention-days: 7
          if-no-files-found: ignore

  # Any other change: the toolchain and the full health gate. The toolchain is the image of this commit's
  # toolchain files (tools/image.py) when the registry gives it, else install.sh as before: a change to
  # those files, the first run before any image, a registry that does not answer or will not give it.
  # Both paths end in the same `make verify`; the last step fails unless the decided path ran and passed.
  # Its limit: the worst case of the install path, 2523 s with the bounds of apt's kept package files
  # (tests/test_install_apt.py, test_the_worst_case_of_the_apt_step_fits_the_jobs_limit; ee-agent-kit/CI.md),
  # in 45 minutes.
  full:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide where the gate runs (the image of this toolchain, or install.sh) and say why
        id: where
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ENABLED: ${{ vars.CI_FULL_IN_IMAGE }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push) git fetch --no-tags --depth=1 origin "$BEFORE" || true; base="$BEFORE" ;;
          esac
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin \
            || echo "no login to ghcr.io: only a public image can be pulled"
          python3 tools/image.py decide --base "$base" --owner "$GITHUB_REPOSITORY_OWNER" \
            --enabled "$ENABLED" --github-output
      # apt's package files kept between runs of the install path (ee-agent-kit/CI.md, "apt's package files
      # kept between runs"): restored into apt's own folder before install.sh, so apt asks the package
      # hosts only for what changed. A pull request's run restores and never saves; a push to main and a
      # run by hand save after a good install. The restore, the copy and the save never fail the run.
      - name: The key of apt's kept package files
        id: apt-cache-key
        if: steps.where.outputs.where == 'install'
        run: bash tools/ci/apt_cache.sh key install.sh "$GITHUB_OUTPUT"
      - name: Restore apt's package files kept by an earlier run
        id: apt-cache-restore
        if: steps.where.outputs.where == 'install'
        uses: actions/cache/restore@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: ${{ steps.apt-cache-key.outputs.restore-keys }}
      - name: Give apt the kept package files
        if: steps.where.outputs.where == 'install'
        timeout-minutes: 1
        continue-on-error: true
        run: bash tools/ci/apt_cache.sh restore "$RUNNER_TEMP/apt-archives" /var/cache/apt/archives
      # The runner's regional mirror crawled to the download's bound (runs 44402154007 and 44432768560),
      # and Ubuntu's own archive did not deliver the index within 120 s (run 44477966021). So apt keeps
      # both and asks first the one fastest in a sample of 1 MiB; in the update it sends a file to the
      # next host after 15 s of silence (tools/ci/apt_archive.sh). The sample is a first guess: in run
      # 44506767788 the first host sent its MiB at 2.47 MB/s and the download at 48.3 kB/s. So install.sh
      # ends a download pass too slow to finish, and runs the script's --slow mode, which puts that host
      # last, before the next pass. A person's computer keeps its mirror: install.sh does not change it.
      # With the list, install.sh's download gives a failed file's host up at once too (0 retries, 15 s of
      # silence: APT_FILE_RETRIES, APT_FILE_TIMEOUT), and apt asks the list's next host for it; in run
      # 44506767788 its own 3 retries and 60 s had sent 151 files back to the same slow host.
      # The variable CI_APT_UBUNTU_ARCHIVE=0 turns all of it off.
      - name: Rank the hosts of Ubuntu's archive by a 1 MiB sample, fastest first
        if: steps.where.outputs.where == 'install'
        env:
          ENABLED: ${{ vars.CI_APT_UBUNTU_ARCHIVE }}
        run: |
          if [ "$ENABLED" = 0 ]; then
            echo "[apt-archive] off: the repository variable CI_APT_UBUNTU_ARCHIVE is 0; apt keeps the runner's mirror"
          else
            sudo env APT_ARCHIVE_CI=1 bash tools/ci/apt_archive.sh /etc/apt
          fi
      - name: Install Via's toolchain (same script as the cloud environment)
        id: install
        if: steps.where.outputs.where == 'install'
        env:
          ENABLED: ${{ vars.CI_APT_UBUNTU_ARCHIVE }}
        run: |
          slow="" retries=3 seconds=60
          if [ "$ENABLED" != 0 ]; then slow="env APT_ARCHIVE_CI=1 bash tools/ci/apt_archive.sh --slow"; retries=0; seconds=15; fi
          sudo env REQUIRE_FREEROUTING=1 APT_UPDATE_TIMEOUT=120 APT_DOWNLOAD_TIMEOUT=570 APT_OTHER_TIMEOUT=300 APT_FILE_RETRIES="$retries" APT_FILE_TIMEOUT="$seconds" APT_SLOW_PASS_COMMAND="$slow" ./install.sh
      # apt takes a file already in its folder by its size alone (apt 2.8.3): the check holds every file
      # to the SHA256 of apt's signed indexes after the install (passed or not), fails the run on a file that is not the
      # package, and keeps for the save only the files an index lists. It says why nothing is saved.
      - name: Check apt's package files against its indexes and keep them for later runs
        id: apt-cache-keep
        if: "!cancelled() && steps.where.outputs.where == 'install'"
        timeout-minutes: 1
        env:
          EVENT: ${{ github.event_name }}
          INSTALLED: ${{ steps.install.outcome }}
          HIT: ${{ steps.apt-cache-restore.outputs.cache-hit }}
          KEY: ${{ steps.apt-cache-key.outputs.key }}
        run: bash tools/ci/apt_cache.sh keep "$RUNNER_TEMP/apt-archives" /var/cache/apt/archives "$GITHUB_OUTPUT"
      - name: Save apt's package files for later runs
        id: apt-cache-save
        if: steps.where.outputs.where == 'install' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.install.outcome == 'success' && steps.apt-cache-keep.outputs.save == 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-cache-key.outputs.key }}
      - name: Verify
        id: verify
        if: steps.where.outputs.where == 'install'
        run: make verify
      # A red gate keeps its evidence: the folder verify/testshards.py keeps (`logs kept: <folder>`), as an
      # artifact, bounded (tools/ci/kept_logs.py: 50 MB, each file's last 2 MB) and kept 7 days. On
      # 2026-11-19 a red run said `see /tmp/ee-verify-.../freerouting.log`, and the file was gone with the
      # runner. Never on success; the gate's steps and these hold no secret.
      - name: Keep the logs of the failed gate
        if: failure() && steps.verify.outcome == 'failure'
        run: python3 tools/ci/kept_logs.py "$RUNNER_TEMP/kept-logs" "${TMPDIR:-/tmp}/ee-verify-*"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.verify.outcome == 'failure'
        with:
          name: gate-logs-full-verify
          path: ${{ runner.temp }}/kept-logs
          retention-days: 7
          if-no-files-found: ignore
      # The container's /tmp is a folder of the runner's temp, so the folder the gate keeps outlives
      # `docker run --rm`: it lands at $RUNNER_TEMP/image-tmp/ee-verify-*.
      - name: Verify inside the image, as the runner's user
        id: inside
        if: steps.where.outputs.where == 'image'
        env:
          IMAGE: ${{ steps.where.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-tmp"
          docker run --rm --user "$(id -u):$(id -g)" -e CI -e GITHUB_ACTIONS -e IMAGE \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -v "$RUNNER_TEMP/image-tmp":/tmp "$IMAGE" \
            bash -e -c 'echo "image: $IMAGE"; python3 tools/image.py show; python3 tools/image.py check; make verify'
      - name: Keep the logs of the failed gate
        if: failure() && steps.inside.outcome == 'failure'
        run: python3 tools/ci/kept_logs.py "$RUNNER_TEMP/kept-logs" "$RUNNER_TEMP/image-tmp/ee-verify-*"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.inside.outcome == 'failure'
        with:
          name: gate-logs-full-inside
          path: ${{ runner.temp }}/kept-logs
          retention-days: 7
          if-no-files-found: ignore
      - name: The decided path ran and passed
        env:
          WHERE: ${{ steps.where.outputs.where }}
          INSTALLED: ${{ steps.verify.outcome }}
          IMAGED: ${{ steps.inside.outcome }}
        run: |
          echo "where: ${WHERE:-none}; install path: $INSTALLED; image path: $IMAGED"
          case "$WHERE" in
            install) test "$INSTALLED" = success ;;
            image) test "$IMAGED" = success ;;
            *) echo "no path was decided"; exit 1 ;;
          esac

  # Windows and macOS (ee-agent-kit/CI.md, "Windows and macOS"): on a pull request that touches install
  # or platform code, on every push to main, on a run by hand; nightly.yml runs the same steps each
  # night (tests/test_ci_desktop.py holds the 2 copies equal). Each leg installs with the installer a
  # person runs, keeps its downloads by the hash of toolchain/desktop.json, and runs
  # tools/ci/desktop_smoke.py with the venv's Python the installer made. The limit, 60 minutes, is a
  # first bound with no run measured: the macOS DMG alone is 1,405,602,755 bytes, and the Linux full
  # job's install bound is 2523 s of its 45 minutes (tests/test_install_apt.py). After the first runs it
  # becomes 1.5 x the longest measured leg, as for `fast`.
  desktop:
    needs: scope
    if: needs.scope.outputs.desktop == 'yes'
    name: desktop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The installers keep their downloads under the root's downloads folder and check each by its
      # SHA256 before use. A pull request's run restores and never saves; a push to main, a night and a
      # run by hand save after a good install. Neither cache step fails the run.
      - name: Restore the downloads kept by an earlier run
        uses: actions/cache/restore@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Application Support/via/downloads' || '~\AppData\Local\Via\downloads' }}
          key: via-desktop-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain/desktop.json') }}
      - name: Install Via with install-macos.sh, as a person does
        id: install-macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ./install-macos.sh --yes
      - name: Install Via with install.ps1, as a person does
        id: install-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:LOCALAPPDATA 'Via\bin')
      - name: Save the downloads for later runs
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.install-macos.outcome == 'success' || steps.install-windows.outcome == 'success')
        uses: actions/cache/save@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Application Support/via/downloads' || '~\AppData\Local\Via\downloads' }}
          key: via-desktop-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain/desktop.json') }}
      - name: The smoke on macOS
        id: smoke-macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "$HOME/Library/Application Support/via/venv/bin/python" tools/ci/desktop_smoke.py --work "$RUNNER_TEMP/desktop-smoke"
      - name: The smoke on Windows
        id: smoke-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $env:LOCALAPPDATA 'Via\venv\Scripts\python.exe') tools/ci/desktop_smoke.py --work (Join-Path $env:RUNNER_TEMP 'desktop-smoke')
      # A red smoke keeps its work folder (the fixtures' copies with what the gates wrote, the tests'
      # logs) for 7 days. Never on success.
      - uses: actions/upload-artifact@v4
        if: failure() && (steps.smoke-macos.outcome == 'failure' || steps.smoke-windows.outcome == 'failure')
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-smoke
          retention-days: 7
          if-no-files-found: ignore

  # The WSL route on windows-latest: Ubuntu 24.04 in WSL 2, the commit cloned inside it, the unchanged
  # install.sh with CI's 3 bounds, then the same smoke. Experimental, so its state is reported, never
  # assumed: only 1 user report says `wsl --install` works on GitHub's Windows runners, and it may need
  # a restart the runner cannot give. `continue-on-error` keeps a red leg out of the workflow's result,
  # and `verdict` prints its result without asking it. The limit: install.sh's worst case is 2523 s
  # (tests/test_install_apt.py), and the WSL install and the smoke come on top of it.
  desktop-wsl:
    needs: scope
    if: needs.scope.outputs.desktop == 'yes'
    name: desktop windows-latest WSL (experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu 24.04 in WSL
        shell: pwsh
        run: |
          wsl --install -d Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # An older store package registers on its first launch; with --root it makes no user.
          if (Get-Command ubuntu2404.exe -ErrorAction SilentlyContinue) {
            ubuntu2404.exe install --root
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          wsl --list --verbose
      - name: Clone this commit inside WSL and run install.sh
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          wsl -d Ubuntu-24.04 -u root --cd "$env:GITHUB_WORKSPACE" -- bash -euc "git config --global --add safe.directory '*'; git clone -q . /root/via; git -C /root/via checkout -q --detach $sha; cd /root/via; env REQUIRE_FREEROUTING=1 APT_UPDATE_TIMEOUT=120 APT_DOWNLOAD_TIMEOUT=570 APT_OTHER_TIMEOUT=300 ./install.sh"
      - name: The smoke inside WSL
        shell: pwsh
        run: wsl -d Ubuntu-24.04 -u root --cd /root/via -- /opt/workcenters/ee/venv/bin/python tools/ci/desktop_smoke.py --work /root/desktop-smoke

  # Always runs, so a required check always resolves: green only when fast passed on every change,
  # full passed as well for a full change, and both desktop legs passed when the scope asked them. A
  # skipped job is not a pass, and a failed scope job leaves no answer. The WSL leg is printed, not asked.
  verdict:
    needs: [scope, fast, full, desktop, desktop-wsl]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The asked jobs passed
        env:
          SCOPE: ${{ needs.scope.outputs.scope }}
          DESKTOP_ASKED: ${{ needs.scope.outputs.desktop }}
          FAST: ${{ needs.fast.result }}
          FULL: ${{ needs.full.result }}
          DESKTOP: ${{ needs.desktop.result }}
          WSL: ${{ needs.desktop-wsl.result }}
        run: |
          echo "scope: ${SCOPE:-none}; desktop asked: ${DESKTOP_ASKED:-none}; fast: $FAST; full: $FULL; desktop: $DESKTOP; wsl (experimental, not required): $WSL"
          ok=yes
          case "$SCOPE" in
            fast) [ "$FAST" = success ] || ok=no ;;
            full) { [ "$FAST" = success ] && [ "$FULL" = success ]; } || ok=no ;;
            *) echo "the scope job gave no answer"; ok=no ;;
          esac
          case "$DESKTOP_ASKED" in
            yes) [ "$DESKTOP" = success ] || ok=no ;;
            no) ;;
            *) echo "the scope job gave no desktop answer"; ok=no ;;
          esac
          test "$ok" = yes
