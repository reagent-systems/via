name: Nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
# Each job's token reads the repository; only `verify` writes, to the ci-failure issue (its last step).
permissions:
  contents: read
jobs:
  # The Linux gate starts after the Windows and macOS legs (the jobs below): its last step speaks for the
  # whole night, so it reads their result. It runs whatever they gave, unless the night was cancelled.
  verify:
    needs: desktop
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # As in ci.yml's install path: apt's package files kept between runs (ee-agent-kit/CI.md, "apt's
      # package files kept between runs"). A night and a run by hand save after a good install.
      - name: The key of apt's kept package files
        id: apt-cache-key
        run: bash tools/ci/apt_cache.sh key install.sh "$GITHUB_OUTPUT"
      - name: Restore apt's package files kept by an earlier run
        id: apt-cache-restore
        uses: actions/cache/restore@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: ${{ steps.apt-cache-key.outputs.restore-keys }}
      - name: Give apt the kept package files
        timeout-minutes: 1
        continue-on-error: true
        run: bash tools/ci/apt_cache.sh restore "$RUNNER_TEMP/apt-archives" /var/cache/apt/archives
      # As in ci.yml's install path: the hosts of Ubuntu's archive, the fastest in a 1 MiB sample first;
      # install.sh puts the host of a download pass too slow to finish last.
      - name: Rank the hosts of Ubuntu's archive by a 1 MiB sample, fastest first
        id: archive
        env:
          ENABLED: ${{ vars.CI_APT_UBUNTU_ARCHIVE }}
        run: |
          if [ "$ENABLED" = 0 ]; then
            echo "[apt-archive] off: the repository variable CI_APT_UBUNTU_ARCHIVE is 0; apt keeps the runner's mirror"
          else
            sudo env APT_ARCHIVE_CI=1 bash tools/ci/apt_archive.sh /etc/apt
          fi
      - name: Install Via's toolchain
        id: install
        env:
          ENABLED: ${{ vars.CI_APT_UBUNTU_ARCHIVE }}
        run: |
          slow="" retries=3 seconds=60
          if [ "$ENABLED" != 0 ]; then slow="env APT_ARCHIVE_CI=1 bash tools/ci/apt_archive.sh --slow"; retries=0; seconds=15; fi
          sudo env REQUIRE_FREEROUTING=1 APT_UPDATE_TIMEOUT=120 APT_DOWNLOAD_TIMEOUT=570 APT_OTHER_TIMEOUT=300 APT_FILE_RETRIES="$retries" APT_FILE_TIMEOUT="$seconds" APT_SLOW_PASS_COMMAND="$slow" ./install.sh
      - name: Check apt's package files against its indexes and keep them for later runs
        id: apt-cache-keep
        if: "!cancelled()"
        timeout-minutes: 1
        env:
          EVENT: ${{ github.event_name }}
          INSTALLED: ${{ steps.install.outcome }}
          HIT: ${{ steps.apt-cache-restore.outputs.cache-hit }}
          KEY: ${{ steps.apt-cache-key.outputs.key }}
        run: bash tools/ci/apt_cache.sh keep "$RUNNER_TEMP/apt-archives" /var/cache/apt/archives "$GITHUB_OUTPUT"
      - name: Save apt's package files for later runs
        id: apt-cache-save
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.install.outcome == 'success' && steps.apt-cache-keep.outputs.save == 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-cache-key.outputs.key }}
      - name: Verify
        id: verify
        # The gate's log is kept for the issue's step: its `why:` lines go into the issue.
        run: |
          mkdir -p build
          set -o pipefail
          make verify 2>&1 | tee build/nightly-verify.log
      # The ci-failure issue follows the nights: tools/ci/nightly_issue.py decides, this step carries it out.
      - name: Open, speak to or close the ci-failure issue
        if: success() || failure()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ARCHIVE: ${{ steps.archive.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          DESKTOP: ${{ needs.desktop.result }}
        with:
          # A night whose Windows or macOS leg did not pass is a failed night, whatever the Linux gate gave.
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const open = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, labels: 'ci-failure', state: 'open' });
            fs.mkdirSync('build', { recursive: true });
            fs.writeFileSync('build/nightly-issues.json', JSON.stringify(open));
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const env = process.env;
            const outcome = env.DESKTOP === 'success' ? env.JOB_STATUS : 'failure';
            const out = execFileSync('python3', ['tools/ci/nightly_issue.py',
              '--outcome', outcome, '--log', 'build/nightly-verify.log',
              '--issues', 'build/nightly-issues.json', '--run', run,
              '--date', new Date().toISOString().slice(0, 10),
              '--step', `archive=${env.ARCHIVE}`, '--step', `install=${env.INSTALL}`,
              '--step', `verify=${env.VERIFY}`, '--step', `desktop=${env.DESKTOP}`],
              { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] });
            for (const act of JSON.parse(out).actions) {
              if (act.do === 'open') {
                await github.rest.issues.create({ ...context.repo, title: act.title, labels: act.labels, body: act.body });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: act.issue, body: act.body });
                if (act.do === 'close') {
                  await github.rest.issues.update({ ...context.repo, issue_number: act.issue,
                    state: 'closed', state_reason: act.reason });
                }
              }
            }

  # The Windows and macOS legs of ci.yml, every night: their steps are ci.yml's to the letter
  # (tests/test_ci_desktop.py holds them equal), without the scope's question. A night catches a moved
  # KiCad download or a new runner image; ee-agent-kit/CI.md, "Windows and macOS", has the why of each step.
  desktop:
    name: desktop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore the downloads kept by an earlier run
        uses: actions/cache/restore@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Application Support/via/downloads' || '~\AppData\Local\Via\downloads' }}
          key: via-desktop-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain/desktop.json') }}
      - name: Install Via with install-macos.sh, as a person does
        id: install-macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ./install-macos.sh --yes
      - name: Install Via with install.ps1, as a person does
        id: install-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:LOCALAPPDATA 'Via\bin')
      - name: Save the downloads for later runs
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.install-macos.outcome == 'success' || steps.install-windows.outcome == 'success')
        uses: actions/cache/save@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Application Support/via/downloads' || '~\AppData\Local\Via\downloads' }}
          key: via-desktop-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain/desktop.json') }}
      - name: The smoke on macOS
        id: smoke-macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "$HOME/Library/Application Support/via/venv/bin/python" tools/ci/desktop_smoke.py --work "$RUNNER_TEMP/desktop-smoke"
      - name: The smoke on Windows
        id: smoke-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $env:LOCALAPPDATA 'Via\venv\Scripts\python.exe') tools/ci/desktop_smoke.py --work (Join-Path $env:RUNNER_TEMP 'desktop-smoke')
      - uses: actions/upload-artifact@v7
        if: failure() && (steps.smoke-macos.outcome == 'failure' || steps.smoke-windows.outcome == 'failure')
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-smoke
          retention-days: 7
          if-no-files-found: ignore

  # ci.yml's experimental WSL leg, every night, its steps ci.yml's to the letter. Its last step reports
  # each step's outcome in the log and the job's summary; no job reads it, so it opens no ci-failure issue.
  desktop-wsl:
    name: desktop windows-latest WSL (experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu 24.04 in WSL
        id: wsl
        continue-on-error: true
        shell: pwsh
        run: |
          wsl --install -d Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # An older store package registers on its first launch; with --root it makes no user.
          if (Get-Command ubuntu2404.exe -ErrorAction SilentlyContinue) {
            ubuntu2404.exe install --root
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          wsl --list --verbose
      - name: Clone this commit inside WSL and run install.sh
        id: install
        if: steps.wsl.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          wsl -d Ubuntu-24.04 -u root --cd "$env:GITHUB_WORKSPACE" -- bash -euc "git config --global --add safe.directory '*'; git clone -q . /root/via; git -C /root/via checkout -q --detach $sha; cd /root/via; env REQUIRE_FREEROUTING=1 APT_UPDATE_TIMEOUT=120 APT_DOWNLOAD_TIMEOUT=570 APT_OTHER_TIMEOUT=300 ./install.sh"
      - name: The smoke inside WSL
        id: smoke
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: wsl -d Ubuntu-24.04 -u root --cd /root/via -- /opt/workcenters/ee/venv/bin/python tools/ci/desktop_smoke.py --work /root/desktop-smoke
      - name: The WSL route's state
        id: report
        if: always()
        shell: bash
        env:
          WSL: ${{ steps.wsl.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          line="wsl (experimental, not required): wsl --install: ${WSL:-none}; install.sh: ${INSTALL:-none}; smoke: ${SMOKE:-none}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          test "$WSL/$INSTALL/$SMOKE" = success/success/success
